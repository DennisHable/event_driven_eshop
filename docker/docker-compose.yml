
services:
  # reverzní proxy; Nginx
  nginx:
    image: nginx:alpine
    container_name: eshop_nginx
    ports:
      - "80:80"                      # port otevřený do PC; poslouchá na všec síťových rozhraních PC (tedy dostupné to bude z libovolné adresy PC na portu 80)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # složka z disku hostilele propojená se složkou v kontejneru
      - ../frontend/dist:/usr/share/nginx/html:ro # v produkci se vytvoří složka dist s kódem
    depends_on:
      - frontend
      - backend

  # FRONTEND; React + Vite
  frontend:
    image: node:20-alpine
    container_name: eshop_frontend
    volumes:
      - ../frontend:/app
    working_dir: /app
    command: npm run dev -- --host   # spustí Vite server a zpřístupní ho v Docker síti
    environment:
      - WATCHPACK_POLLING=true       # pro Linux (Fedora), aby fungoval Hot-Reload při uložení souboru


  # DB (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: eshop_postgres
    environment:
      POSTGRES_DB: eshop_db         # název výchozí databáze
      POSTGRES_USER: eshop_user     # přihlašovací jméno
      POSTGRES_PASSWORD: secret_pwd # heslo do DB
  #  ports:
  #    - "5433:5432"                 # zpřístupní Postgres na PC na portu 5433 v kontejneru na portu 5432; slouží pro vývoj, pak odebrat
    volumes:
      - postgres_data:/var/lib/postgresql/data # data zůstanou uložená i po vypnutí kontejneru; vytváří se (kvůli rychlosti zápisů) izolovaný virtuální disk pod správou dockeru "postgres_data"

  # Redis (caching)
  redis:
    image: redis:7-alpine
    container_name: eshop_redis
  #  ports:
  #    - "6379:6379"                 # zpřístupní Redis na portu 6379; slouží pro vývoj, pak odebrat
    volumes:
      - redis_data:/data

  # Zookeeper; Kafka koordinace
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: eshop_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: eshop_kafka
    depends_on:
      - zookeeper                   # kafka se nespustí, dokud nenaskočí Zookeeper
  #  ports:
  #    - "9092:9092"                 # Port pro komunikaci z PC a v kontejneru; slouží pro vývoj, pak odebrat
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 # jak se Kafka spojí se Zookeeperem uvnitř sítě Dockeru
      # konfig. síťových listenerů (pro vnitřní síť Dockeru i pro vnější svět z hostitelského PC)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # pro lokální vývoj stačí 1 replika stavu

  # PHP BACKEND
  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: eshop_backend
    # environment:
    #  - APP_ENV=prod # Symfony bude běžet v produkci, pro dev server se použije .env konfig
    #   ports:
 #     - "8000:8000" # zpřístupní Symfony webserver na PC; slouží pro vývoj, pak odebrat
    volumes:
      - ../backend:/var/www/html        # propojí lokální složku backend se složkou v kontejneru
    working_dir: /var/www/html
    depends_on:
      - postgres
      - kafka


# izolované virtuální disky pro kontejnery, co drží data i po restartu kontejneru
volumes:
  postgres_data:
  redis_data:
